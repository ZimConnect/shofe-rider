name: shofe_rider
description: Shofe Rider - ZimConnect ride hailing app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  # FIREBASE - STABLE V2 FOR COMPATIBILITY
  firebase_core: ^2.8.0
  firebase_auth: ^4.6.3
  firebase_firestore: ^4.4.5

  # OTHER PACKAGES
  provider: ^6.1.2
  http: ^1.1.2
  google_maps_flutter: ^2.5.0
  permission_handler: ^11.3.1
  geolocator: ^10.0.0

flutter:
  uses-material-design: true
