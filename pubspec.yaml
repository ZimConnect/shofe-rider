name: shofe_rider
description: "Shofe Rider App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: "3.22.3"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - Stable versions for Flutter 3.22.3
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.6.13

  # Flutter defaults
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
    dev_dependencies:
      flutter_launcher_icons: ^0.14.3

    flutter_launcher_icons:
      android: true
      ios: true
      image_path: "assets/icon.png"
      min_sdk_android: 21
