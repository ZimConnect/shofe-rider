
name: shofe_rider
description: Shofe Rider App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # CORE - ALL V2 EMBEDDING
  webview_flutter: ^4.7.0
  google_maps_flutter: ^2.7.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  
  # SCANNER - V2 VERSIONS
  mobile_scanner: ^5.1.2        # Barcode + QR Scanner V2
  image_picker: ^1.1.2          # Camera/Gallery V2
  
  # NETWORK + STATE
  http: ^1.2.2
  dio: ^5.4.3
  provider: ^6.1.2
  
  # STORAGE
  shared_preferences: ^2.2.3
  
  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.13
  intl: ^0.19.0
  
  # FIREBASE - ALL V2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
