name: shofe_rider
description: Shofe Rider Driver App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Maps & Location - UPDATED FOR V2 EMBEDDING
  google_maps_flutter: ^2.7.0
  location: ^6.0.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Firebase - UPDATED FOR V2 EMBEDDING
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.3.3
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.3
  
  # UI
  flutter_svg: ^2.0.13
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  
  # Other
  url_launcher: ^6.3.0
  flutter_polyline_points: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
dependency_overrides:
  flutter_native_splash: ^2.3.3
