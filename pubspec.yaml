version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: "3.22.3"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - Versions that 100% work with Flutter 3.22.3
  firebase_core: ^2.25.7
  firebase_auth: ^4.17.9
  firebase_firestore: ^4.17.4
  firebase_storage: ^11.6.12
  firebase_messaging: ^14.7.21

  # Flutter defaults
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
