name: shofe_rider
description: "Shofe Rider App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: "3.22.3"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - Versions that work with Flutter 3.22.3
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_firestore: ^4.15.3  # <- FIXED
  firebase_storage: ^11.5.6
