name: shofe_rider
description: "Shofe Rider App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # === UPGRADED TO V2 EMBEDDING ===
  geolocator: ^11.0.0              # Live location V2
  google_maps_flutter: ^2.7.0      # Maps V2
  flutter_polyline_points: ^2.1.0  # Route drawing V2

  # === OTHER DEPENDENCIES ===
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
