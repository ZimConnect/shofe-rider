name: Flutter Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false
      
      - name: NUKE V1 FILES EVERYWHERE
        run: |
          rm -rf .flutter-plugins .flutter-plugins-dependencies
          rm -rf android/.gradle android/build build
          flutter clean
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: VERIFY NO V1 PLUGINS
        run: |
          echo "Checking for V1 plugins..."
          grep -r "io.flutter.plugins" .flutter-plugins-dependencies || echo "Clean"
      
      - name: Build Android APK
        run: flutter build apk --release --verbose
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shofe-rider-apk
          path: build/app/outputs/flutter-apk/app-release.apk
