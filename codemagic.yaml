workflows:
  shoferider-android:
    name: Shofe Rider Android Release
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.27.4
      cocoapods: default
      xcode: latest
    scripts:
      - name: VERIFY V2
        script: |
          echo "Checking AndroidManifest"
          cat android/app/src/main/AndroidManifest.xml | grep flutterEmbedding
      - name: Force Flutter 3.27.4
        script: |
          flutter --version
          flutter channel stable
          flutter upgrade
          flutter --version
      - name: NUKE V1 FILES EVERYWHERE
        script: |
          echo "Searching and deleting ALL V1 files"
          find android -type f \( -name "*.java" -o -name "*.kt" \) -exec grep -l "io.flutter.app\|FlutterActivity" {} \; | xargs rm -f
          echo "V1 files nuked"
      - name: SHOW MAINACTIVITY
        script: |
          echo "Checking what MainActivity files are left"
          find android -name "MainActivity.*"
          echo "--- Content of MainActivity ---"
          cat android/app/src/main/kotlin/com/zimconnect/shoferider/MainActivity.kt || cat android/app/src/main/java/com/zimconnect/shoferider/MainActivity.java || echo "No MainActivity found"
      - name: Install Dependencies
        script: flutter pub get
      - name: Clean Android
        script: |
          cd android
          ./gradlew clean
          cd ..
       - name: FIND V1 PLUGINS
        script: |
          echo "Checking which plugins use V1"
          cd android
          ./gradlew app:dependencies | grep -i flutter
          cd ..
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - shofer.zimconnect@gmail.com
