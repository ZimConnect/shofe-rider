workflows:
  shofe-rider-android:
    name: Shofe Rider Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter:3.22.3
      cocoapods: default
      xcode: latest
    scripts:
      scripts:
    - name: Install Flutter 3.22.3
    script: |
      flutter --version
      flutter channel stable
      flutter upgrade
      flutter --version
    - name: Install dependencies
    script: flutter pub get
    - name: Build Android APK
    script: flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - shofe.zimconnect@gmail.com  # You will get build results here
