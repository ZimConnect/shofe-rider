workflows:
  shofe-rider-android:
    name: Shofe Rider Android Release
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.22.3
      cocoapods: default
      xcode: latest
    scripts:
      - name: Force Flutter 3.22.3
        script: |
          flutter --version
          flutter channel stable
          flutter upgrade
          flutter --version
      - name: NUKE V1 FILES
        script: |
          rm -rf android/app/src/main/java/io/flutter/app/*
          rm -rf android/app/src/main/java/com/shoferider/*
      - name: Install Dependencies
        script: flutter pub get
      - name: Clean Android
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean
          cd ..
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - shofe.zimconnect@gmail.com
