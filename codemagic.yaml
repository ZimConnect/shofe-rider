workflows:
  shofe-rider-android:
    name: Shofe Rider Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable  # Uses latest stable Flutter so firebase ^4.13.6 works
      cocoapods: default
      xcode: latest
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - shofe.zimconnect@gmail.com  # You will get build results here
