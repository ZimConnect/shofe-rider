workflows:
  shoferider-full-build:
    name: ShofeRider Force Flutter Create
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.0
      xcode: 15.4
      cocoapods: default
    scripts:
      - name: Create Flutter project from scratch
        script: |
          flutter create shoferider_app --platforms=android,ios,web
          cp -r shoferider_app/* .
          cp -r shoferider_app/.* . 2>/dev/null || true
          rm -rf shoferider_app
          
      - name: Copy your lib folder back
        script: |
          git checkout HEAD -- lib/ 2>/dev/null || true
          
      - name: Get dependencies
        script: |
          flutter pub get
          
      - name: Build Android APK
        script: |
          flutter build apk --release
          
      - name: Build Android AppBundle
        script: |
          flutter build appbundle --release
          
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
          
      - name: Build Web
        script: |
          flutter build web --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/ios/iphoneos/Runner.app
      - build/web/**
    
    publishing:
      email:
        recipients:
          - shofe.zimconnect@gmail.com
